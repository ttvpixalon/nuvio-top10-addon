name: Build & publish Top 10 addon

on:
  schedule:
    - cron: "23 */6 * * *"      # every 6 hours (UTC)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: Generate catalogs and artwork
        env:
          # Public URL the addon will be served from. Override with a repository variable named SITE_URL
          # if you use a custom domain or a <user>.github.io root repo.
          SITE_URL: ${{ vars.SITE_URL != '' && vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          # Ranking sources (repository secrets). Each one that is set joins the consensus; Cinemeta is always on.
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}   # Trakt "most watched" — real plays by real users
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}         # TMDB "trending today"
          # Optional repository variables
          TRAKT_PERIOD: ${{ vars.TRAKT_PERIOD != '' && vars.TRAKT_PERIOD || 'weekly' }}   # daily | weekly | monthly | yearly
          SOURCES: ${{ vars.SOURCES }}                      # e.g. "trakt" to use Trakt alone instead of the consensus
          TOP_N: ${{ vars.TOP_N != '' && vars.TOP_N || '10' }}
          WIDE_STYLE: ${{ vars.WIDE_STYLE != '' && vars.WIDE_STYLE || 'merged' }}   # merged | backdrop | poster
        run: python generate.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
